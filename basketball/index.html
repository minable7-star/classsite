<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>농구 점수판</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    background: #111418;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* 상단: 타이머와 쿼터 */
  .top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 12px;
    background: #1b1f25;
    flex-wrap: wrap;
  }
  .quarter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 700;
  }
  .timer {
    font-size: clamp(40px, 9vw, 72px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #ffd84d;
    min-width: 4.2em;
    text-align: center;
  }
  .timer.done { color: #ff5c5c; animation: blink 0.6s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .ctrl { display: flex; gap: 8px; }

  /* 팀 영역 */
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 12px;
    gap: 12px;
  }
  .home { background: #1d4ed8; }
  .away { background: #c62828; }

  .name {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 2px dashed rgba(255,255,255,0.4);
    color: #fff;
    text-align: center;
    width: 90%;
    max-width: 320px;
    padding: 4px;
    outline: none;
  }
  .score {
    font-size: clamp(90px, 22vw, 200px);
    font-weight: 900;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .btns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 340px;
  }

  button {
    font-family: inherit;
    font-weight: 800;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.08s;
  }
  button:active { transform: scale(0.94); }
  .add {
    font-size: 26px;
    padding: 16px 0;
    background: rgba(255,255,255,0.95);
    color: #111;
  }
  .minus {
    grid-column: span 3;
    font-size: 18px;
    padding: 10px 0;
    background: rgba(0,0,0,0.25);
    color: #fff;
  }
  .small {
    font-size: 16px;
    padding: 10px 16px;
    background: #2f3640;
    color: #fff;
  }
  .start { background: #22a35a; }
  .q-btn {
    width: 36px; height: 36px;
    font-size: 20px;
    background: #2f3640;
    color: #fff;
  }

  /* 하단 */
  .bottom {
    padding: 12px;
    background: #1b1f25;
    display: flex;
    justify-content: center;
  }
  .reset { background: #444; }

  /* 세로 화면이 좁을 때는 위아래로 */
  @media (max-width: 520px) and (orientation: portrait) {
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <div class="top">
    <div class="quarter">
      <button class="q-btn" onclick="changeQuarter(-1)">‹</button>
      <span id="quarter">1쿼터</span>
      <button class="q-btn" onclick="changeQuarter(1)">›</button>
    </div>
    <div class="timer" id="timer">10:00</div>
    <div class="ctrl">
      <button class="small start" id="startBtn" onclick="toggleTimer()">시작</button>
      <button class="small" onclick="resetTimer()">타이머 리셋</button>
    </div>
  </div>

  <div class="board">
    <div class="team home">
      <input class="name" value="홈" maxlength="10" aria-label="홈팀 이름">
      <div class="score" id="score0">0</div>
      <div class="btns">
        <button class="add" onclick="addScore(0, 1)">+1</button>
        <button class="add" onclick="addScore(0, 2)">+2</button>
        <button class="add" onclick="addScore(0, 3)">+3</button>
        <button class="minus" onclick="addScore(0, -1)">−1 (정정)</button>
      </div>
    </div>

    <div class="team away">
      <input class="name" value="원정" maxlength="10" aria-label="원정팀 이름">
      <div class="score" id="score1">0</div>
      <div class="btns">
        <button class="add" onclick="addScore(1, 1)">+1</button>
        <button class="add" onclick="addScore(1, 2)">+2</button>
        <button class="add" onclick="addScore(1, 3)">+3</button>
        <button class="minus" onclick="addScore(1, -1)">−1 (정정)</button>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="small reset" onclick="resetAll()">전체 초기화</button>
  </div>

<script>
  // ===== 점수 =====
  const scores = [0, 0];

  function addScore(team, point) {
    scores[team] = Math.max(0, scores[team] + point); // 0점 아래로 내려가지 않음
    document.getElementById('score' + team).textContent = scores[team];
  }

  // ===== 쿼터 =====
  let quarter = 1;

  function changeQuarter(step) {
    quarter = Math.min(4, Math.max(1, quarter + step));
    document.getElementById('quarter').textContent = quarter + '쿼터';
  }

  // ===== 타이머 =====
  const QUARTER_SECONDS = 10 * 60; // 쿼터 시간: 10분
  let remaining = QUARTER_SECONDS;
  let timerId = null;

  function showTime() {
    const m = String(Math.floor(remaining / 60)).padStart(2, '0');
    const s = String(remaining % 60).padStart(2, '0');
    const el = document.getElementById('timer');
    el.textContent = m + ':' + s;
    el.classList.toggle('done', remaining === 0);
  }

  function toggleTimer() {
    const btn = document.getElementById('startBtn');
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      btn.textContent = '시작';
      return;
    }
    if (remaining === 0) return;
    btn.textContent = '정지';
    timerId = setInterval(() => {
      remaining--;
      showTime();
      if (remaining <= 0) {
        clearInterval(timerId);
        timerId = null;
        btn.textContent = '시작';
        beep();
      }
    }, 1000);
  }

  function resetTimer() {
    clearInterval(timerId);
    timerId = null;
    remaining = QUARTER_SECONDS;
    document.getElementById('startBtn').textContent = '시작';
    showTime();
  }

  // 종료 알림음
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = 880;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1.2);
    } catch (e) {}
  }

  // ===== 전체 초기화 =====
  function resetAll() {
    if (!confirm('점수, 쿼터, 타이머를 모두 초기화할까요?')) return;
    scores[0] = 0; scores[1] = 0;
    document.getElementById('score0').textContent = 0;
    document.getElementById('score1').textContent = 0;
    quarter = 1;
    document.getElementById('quarter').textContent = '1쿼터';
    resetTimer();
  }

  showTime();
</script>
</body>
</html>
